name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    env:
      # Keep console output UTF-8 so Chinese mode names print correctly. The test
      # scripts also reconfigure their own streams, for direct local runs.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      # Build in a virtual environment, as docs/Windows-Build.md describes. The
      # runner image preinstalls tools such as pipx, whose packaging>=26.3
      # requirement conflicts with the packaging==25.0 pin that PyInstaller needs;
      # an isolated environment keeps that pin intact and `pip check` meaningful.
      # Every step calls the interpreter by path so PATH ordering cannot matter.
      - name: Create virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -c "import sys; print('interpreter:', sys.executable)"
      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
      - name: Verify environment
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Unit tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: GUI smoke test
        run: .\.venv\Scripts\python.exe tests/gui_smoke.py
      # Drives the real mouse and keyboard to open the mode menu, which needs an
      # unlocked desktop. gui_smoke exercises the same switching code path, so a
      # failure here is reported but does not block the release.
      - name: Mode menu switching test
        continue-on-error: true
        run: .\.venv\Scripts\python.exe tests/menu_switch_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
      - name: Build executable
        run: .\.venv\Scripts\python.exe build_windows.py
      - name: Packaged smoke test
        run: |
          $exe = (Get-ChildItem dist/*.exe).FullName
          .\.venv\Scripts\python.exe tests/packaged_smoke.py $exe
      - name: Generate sample data package
        run: |
          .\.venv\Scripts\python.exe tools/make_template_data.py
          Compress-Archive -Path build/TemplateData/* -DestinationPath build/TemplateData.zip -Force
      - name: Install pandoc
        run: |
          choco install pandoc --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
      - name: Build manual PDF
        run: .\.venv\Scripts\python.exe tools/build_manual_pdf.py
      # upload-artifact keeps the directory layout of the matched paths, so collect
      # everything into one flat directory. Otherwise the downloaded assets end up
      # nested and the release globs never match them.
      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/*.exe release/
          Copy-Item build/TemplateData.zip release/
          Copy-Item manual/Manual.pdf release/
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release/*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -c "import sys; print('interpreter:', sys.executable)"
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify environment
        run: .venv/bin/python -m pip check
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build app bundle
        run: .venv/bin/python build_macos.py
      - name: Archive app
        run: |
          ls -la dist
          cd dist
          tar -czf "../build-Dissolution-Combustion-mac.tar.gz" ./*.app
          mkdir -p ../release
          mv "../build-Dissolution-Combustion-mac.tar.gz" ../release/
          ls -la ../release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Needed for body_path: the release text comes from the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -lh assets
      # Check the files exist before publishing: a release step that silently
      # matches nothing still reports success.
      - name: Verify expected assets
        run: |
          set -e
          fail=0
          for pattern in '*.exe' '*.tar.gz' '*.zip' '*.pdf'; do
            if ! compgen -G "assets/$pattern" > /dev/null; then
              echo "::error::missing release asset matching $pattern"
              fail=1
            fi
          done
          exit $fail
      - name: Generate checksums
        run: |
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          body_path: docs/Release-v2.2.5.md
          draft: true
          generate_release_notes: false
