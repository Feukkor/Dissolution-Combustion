name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      # Build in a virtual environment, as docs/Windows-Build.md describes. The
      # runner image preinstalls tools such as pipx, whose packaging>=26.3
      # requirement conflicts with the packaging==25.0 pin that PyInstaller needs;
      # an isolated environment keeps that pin intact and `pip check` meaningful.
      # Every step calls the interpreter by path so PATH ordering cannot matter.
      - name: Create virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -c "import sys; print('interpreter:', sys.executable)"
      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
      - name: Verify environment
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Unit tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: GUI smoke test
        run: .\.venv\Scripts\python.exe tests/gui_smoke.py
      # Drives the real mouse and keyboard to open the mode menu, which needs an
      # unlocked desktop. gui_smoke exercises the same switching code path, so a
      # failure here is reported but does not block the release.
      - name: Mode menu switching test
        continue-on-error: true
        run: .\.venv\Scripts\python.exe tests/menu_switch_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt
      - name: Build executable
        run: .\.venv\Scripts\python.exe build_windows.py
      - name: Packaged smoke test
        run: |
          $exe = (Get-ChildItem dist/*.exe).FullName
          .\.venv\Scripts\python.exe tests/packaged_smoke.py $exe
      - name: Generate sample data package
        run: |
          .\.venv\Scripts\python.exe tools/make_template_data.py
          Compress-Archive -Path build/TemplateData/* -DestinationPath build/TemplateData.zip -Force
      - name: Install pandoc
        run: |
          choco install pandoc --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
      - name: Build manual PDF
        run: .\.venv\Scripts\python.exe tools/build_manual_pdf.py
      - name: Checksums
        run: |
          $files = @(Get-ChildItem dist/*.exe) + @(Get-Item build/TemplateData.zip) + @(Get-Item manual/Manual.pdf)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content build/SHA256SUMS.txt -Encoding ascii
          Get-Content build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/*.exe
            build/TemplateData.zip
            build/SHA256SUMS.txt
            manual/Manual.pdf

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -c "import sys; print('interpreter:', sys.executable)"
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify environment
        run: .venv/bin/python -m pip check
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build app bundle
        run: .venv/bin/python build_macos.py
      - name: Archive app
        run: |
          ls -la dist
          cd dist
          tar -czf "../build-Dissolution-Combustion-mac.tar.gz" ./*.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: build-Dissolution-Combustion-mac.tar.gz

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Needed for body_path: the release text comes from the repository.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List assets
        run: ls -lh assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.exe
            assets/*.tar.gz
            assets/*.zip
            assets/SHA256SUMS.txt
            assets/Manual.pdf
          body_path: docs/Release-v2.2.5.md
          draft: true
          generate_release_notes: false
